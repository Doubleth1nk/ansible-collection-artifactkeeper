---
name: Bug report
description: Report a reproducible collection problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste real tokens, passwords, or upstream credentials.
  - type: input
    id: collection
    attributes:
      label: Collection version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: ansible
    attributes:
      label: ansible-core version
    validations:
      required: true
  - type: input
    id: artifact_keeper
    attributes:
      label: Artifact Keeper version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Redact all secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
