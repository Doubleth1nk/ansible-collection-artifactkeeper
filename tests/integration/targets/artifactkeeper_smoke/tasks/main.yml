---
# This target intentionally requires a disposable/live Artifact Keeper instance.
# Supply artifactkeeper_test_url and artifactkeeper_test_token through the
# ansible-test integration environment; normal unit/sanity CI does not run it.
- name: Require explicit integration credentials
  ansible.builtin.assert:
    that:
      - artifactkeeper_test_url is defined
      - artifactkeeper_test_token is defined
    fail_msg: Set artifactkeeper_test_url and artifactkeeper_test_token for live integration testing.

- name: Verify read-only project lookup
  artifactkeeper.core.project_info:
    api_url: "{{ artifactkeeper_test_url }}"
    token: "{{ artifactkeeper_test_token }}"
  register: artifactkeeper_projects

- name: Validate project-info structured result
  ansible.builtin.assert:
    that:
      - artifactkeeper_projects.changed is false
      - artifactkeeper_projects.projects is iterable

- name: Verify read-only group lookup
  artifactkeeper.core.group_info:
    api_url: "{{ artifactkeeper_test_url }}"
    token: "{{ artifactkeeper_test_token }}"
  register: artifactkeeper_groups

- name: Validate structured result
  ansible.builtin.assert:
    that:
      - artifactkeeper_groups.changed is false
      - artifactkeeper_groups.groups is iterable

- name: Verify read-only repository lookup
  artifactkeeper.core.repository_info:
    api_url: "{{ artifactkeeper_test_url }}"
    token: "{{ artifactkeeper_test_token }}"
  register: artifactkeeper_repositories

- name: Validate repository-info structured result
  ansible.builtin.assert:
    that:
      - artifactkeeper_repositories.changed is false
      - artifactkeeper_repositories.repositories is iterable
      - artifactkeeper_repositories.repository is none

# Writes a grant, so it only runs when a disposable repository and group are
# named explicitly; the grant is removed again at the end of the block.
- name: Exercise repository permission lifecycle
  when:
    - artifactkeeper_test_permission_repository is defined
    - artifactkeeper_test_permission_group is defined
  block:
    - name: Grant read access
      artifactkeeper.core.repository_permission:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        repository: "{{ artifactkeeper_test_permission_repository }}"
        principal_type: group
        principal: "{{ artifactkeeper_test_permission_group }}"
        actions: [read]
      register: artifactkeeper_grant_create

    - name: Grant read access again
      artifactkeeper.core.repository_permission:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        repository: "{{ artifactkeeper_test_permission_repository }}"
        principal_type: group
        principal: "{{ artifactkeeper_test_permission_group }}"
        actions: [read]
      register: artifactkeeper_grant_repeat

    - name: Change granted actions
      artifactkeeper.core.repository_permission:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        repository: "{{ artifactkeeper_test_permission_repository }}"
        principal_type: group
        principal: "{{ artifactkeeper_test_permission_group }}"
        actions: [write, read]
      register: artifactkeeper_grant_update

    - name: Validate grant lifecycle results
      ansible.builtin.assert:
        that:
          - artifactkeeper_grant_create is changed
          - artifactkeeper_grant_repeat is not changed
          - artifactkeeper_grant_update is changed
          - artifactkeeper_grant_update.permission.actions | sort == ['read', 'write']

  always:
    - name: Remove the grant
      artifactkeeper.core.repository_permission:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        repository: "{{ artifactkeeper_test_permission_repository }}"
        principal_type: group
        principal: "{{ artifactkeeper_test_permission_group }}"
        state: absent

- name: Verify read-only user lookup
  artifactkeeper.core.user_info:
    api_url: "{{ artifactkeeper_test_url }}"
    token: "{{ artifactkeeper_test_token }}"
  register: artifactkeeper_users

- name: Validate user-info structured result
  ansible.builtin.assert:
    that:
      - artifactkeeper_users.changed is false
      - artifactkeeper_users.users is iterable
      - artifactkeeper_users.user is none
      - artifactkeeper_users.users | selectattr('is_service_account') | list | length == 0

# Creates a user, so it only runs when a disposable username and email are
# named explicitly; the user is deleted again at the end of the block.
- name: Exercise user lifecycle
  when:
    - artifactkeeper_test_user_username is defined
    - artifactkeeper_test_user_email is defined
  block:
    - name: Create user
      artifactkeeper.core.user:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        username: "{{ artifactkeeper_test_user_username }}"
        email: "{{ artifactkeeper_test_user_email }}"
        display_name: Ansible smoke test
      register: artifactkeeper_user_create
      no_log: true

    - name: Create user again
      artifactkeeper.core.user:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        username: "{{ artifactkeeper_test_user_username }}"
        email: "{{ artifactkeeper_test_user_email }}"
        display_name: Ansible smoke test
      register: artifactkeeper_user_repeat

    - name: Deactivate user
      artifactkeeper.core.user:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        username: "{{ artifactkeeper_test_user_username }}"
        is_active: false
      register: artifactkeeper_user_deactivate

    - name: Look up the user by exact username
      artifactkeeper.core.user_info:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        username: "{{ artifactkeeper_test_user_username }}"
      register: artifactkeeper_user_lookup

    - name: Validate user lifecycle results
      ansible.builtin.assert:
        that:
          - artifactkeeper_user_create is changed
          - artifactkeeper_user_repeat is not changed
          - artifactkeeper_user_deactivate is changed
          - artifactkeeper_user_deactivate.changed_fields == ['is_active']
          - artifactkeeper_user_lookup.user.username == artifactkeeper_test_user_username
          - artifactkeeper_user_lookup.user.is_active is false

  always:
    - name: Delete user
      artifactkeeper.core.user:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        username: "{{ artifactkeeper_test_user_username }}"
        state: absent

# Creates a group, so it only runs when a disposable group name and an existing
# disposable member username are named explicitly; the group is deleted again
# at the end of the block.
- name: Exercise group lifecycle
  when:
    - artifactkeeper_test_group_name is defined
    - artifactkeeper_test_group_member is defined
  block:
    - name: Create group with an exact membership
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        description: Ansible smoke test
        members:
          - "{{ artifactkeeper_test_group_member }}"
      register: artifactkeeper_group_create

    - name: Create group again
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        description: Ansible smoke test
        members:
          - "{{ artifactkeeper_test_group_member }}"
      register: artifactkeeper_group_repeat

    - name: Append an existing member
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        members:
          - "{{ artifactkeeper_test_group_member }}"
        members_mode: append
      register: artifactkeeper_group_append

    - name: Look up the group
      artifactkeeper.core.group_info:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
      register: artifactkeeper_group_lookup

    - name: Update the description
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        description: Ansible smoke test (updated)
      register: artifactkeeper_group_description

    - name: Remove the member
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        members:
          - "{{ artifactkeeper_test_group_member }}"
        members_mode: remove
      register: artifactkeeper_group_remove

    - name: Require an empty membership
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        members: []
      register: artifactkeeper_group_empty

    - name: Delete the group in check mode
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        state: absent
      check_mode: true
      register: artifactkeeper_group_check_delete

    - name: Confirm the group still exists after the check-mode delete
      artifactkeeper.core.group_info:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
      register: artifactkeeper_group_after_check

    - name: Validate group lifecycle results
      ansible.builtin.assert:
        that:
          - artifactkeeper_group_create is changed
          - artifactkeeper_group_create.members == [artifactkeeper_test_group_member]
          - artifactkeeper_group_repeat is not changed
          - artifactkeeper_group_append is not changed
          - artifactkeeper_group_lookup.group.member_count == 1
          - artifactkeeper_group_description is changed
          - artifactkeeper_group_description.changed_fields == ['description']
          - artifactkeeper_group_remove is changed
          - artifactkeeper_group_remove.members == []
          - artifactkeeper_group_empty is not changed
          - artifactkeeper_group_check_delete is changed
          - artifactkeeper_group_after_check.group is not none

  always:
    - name: Delete the group
      artifactkeeper.core.group:
        api_url: "{{ artifactkeeper_test_url }}"
        token: "{{ artifactkeeper_test_token }}"
        name: "{{ artifactkeeper_test_group_name }}"
        state: absent
