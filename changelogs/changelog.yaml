ancestor: null
releases:
  0.1.0:
    changes:
      minor_changes:
      - Add a shared Artifact Keeper API client using ``ansible.module_utils.urls``.
      - Add idempotent project, project-info, repository, service-account, service-account-token,
        project-member, virtual-repository-members, and group-info modules; repository
        age-gate policy is managed as nested repository configuration.
      - Add unit-test, sanity-test, lint, release, changelog, and integration-test
        scaffolding.
      release_summary: Initial development release.
    fragments:
    - 0.1.0.yml
    release_date: '2026-10-04'
  0.2.0:
    changes:
      release_summary: Adds user management and repository-level access control. New
        modules manage local users and direct repository permission grants, and look
        up users and repositories. Password-related values are now redacted from API
        error messages.
      security_fixes:
      - Redact ``new_password``, ``current_password``, ``generated_password``, and
        ``temporary_password`` values from Artifact Keeper API error messages.
    fragments:
    - 0.2.0.yml
    - user-management.yml
    modules:
    - description: Gather Artifact Keeper repository information
      name: repository_info
      namespace: ''
    - description: Manage Artifact Keeper repository permission grants
      name: repository_permission
      namespace: ''
    - description: Manage Artifact Keeper users
      name: user
      namespace: ''
    - description: Gather Artifact Keeper user information
      name: user_info
      namespace: ''
    release_date: '2026-10-07'
  0.3.0:
    changes:
      minor_changes:
      - The documented Artifact Keeper API baseline is now 1.10.2. All endpoints used
        by the collection are unchanged from 1.10.1 except service-account token creation,
        which 1.10.2 validates more strictly; the payload sent by ``service_account_token``
        already complies. The documentation now covers the 1.10.2 token-creation rules,
        the repository scopes accepted by API tokens, and repository visibility for
        scoped admin tokens.
      - '``service_account_token`` - add the ``repositories`` (repository keys) and
        ``repo_selector`` options for repository-scoped tokens, report managed differences
        through ``changed_fields``, and refresh ``token_info`` after creation so the
        effective repository restriction is visible. Restrictions are compared only
        when managed; when neither option is supplied, the restriction is unmanaged,
        as before.'
      - '``service_account_token`` - rotations now create the replacement token before
        revoking the old one, so a failed creation leaves the existing token in place.
        If revoking the old token fails, the replacement is revoked again, and a failed
        rotation never returns the new plaintext token.'
      release_summary: Adds group management and repository-scoped service-account
        tokens, and moves the documented Artifact Keeper baseline to 1.10.2. The new
        ``group`` module manages local groups and their membership. ``service_account_token``
        can restrict tokens to repositories by key or selector and now rotates tokens
        safely by creating the replacement before revoking the old token. 0.3.0 targets
        the Artifact Keeper 1.10.2 API contract.
    fragments:
    - 0.3.0.yml
    - artifact-keeper-1.10.2.yml
    - service-account-token-repository-scope.yml
    modules:
    - description: Manage Artifact Keeper groups and their membership
      name: group
      namespace: ''
    release_date: '2026-10-07'
  0.4.0:
    changes:
      release_summary: Adds repository label management, repository security scan
        configuration, and security policy management. The new ``repository_labels``
        module manages a repository's labels as a complete set or by individual key;
        ``repository_scan_config`` manages a repository's scan settings; and ``security_policy``
        manages global and repository-scoped security policies by exact name. 0.4.0
        continues to target the Artifact Keeper 1.10.2 API contract.
    fragments:
    - 0.4.0.yml
    modules:
    - description: Manage Artifact Keeper repository labels
      name: repository_labels
      namespace: ''
    - description: Manage Artifact Keeper repository security scan configuration
      name: repository_scan_config
      namespace: ''
    - description: Manage Artifact Keeper security policies
      name: security_policy
      namespace: ''
    release_date: '2026-10-09'
