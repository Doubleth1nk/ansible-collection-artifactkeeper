---
minor_changes:
  - >-
    Add the ``user`` module to create, update, and delete Artifact Keeper users
    by exact username. The password is only used when a user is created, and a
    server-generated password is returned once as ``generated_password``.
  - >-
    Add the ``user_info`` module for read-only exact or filtered user lookups.
security_fixes:
  - >-
    Redact ``new_password``, ``current_password``, ``generated_password``, and
    ``temporary_password`` values from Artifact Keeper API error messages.
