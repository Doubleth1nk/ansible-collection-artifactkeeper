---
minor_changes:
  - >-
    ``service_account_token`` - add the ``repositories`` (repository keys) and
    ``repo_selector`` options to restrict created tokens to repositories. A
    supplied restriction is compared with the existing token, and a difference
    rotates the token. When neither option is supplied, the restriction is
    unmanaged, as before.
  - >-
    ``service_account_token`` - rotations now create the replacement token before
    revoking the old one, so a failed creation leaves the existing token in place.
    If revoking the old token fails, the replacement is revoked again, and a
    failed rotation never returns the new plaintext token.
