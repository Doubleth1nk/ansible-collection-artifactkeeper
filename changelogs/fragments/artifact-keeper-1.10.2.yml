---
minor_changes:
  - >-
    The documented Artifact Keeper API baseline is now 1.10.2. All endpoints
    used by the collection are unchanged from 1.10.1 except service-account
    token creation, which 1.10.2 validates more strictly; the payload sent by
    ``service_account_token`` already complies. The documentation now covers
    the 1.10.2 token-creation rules, the repository scopes accepted by API
    tokens, and repository visibility for scoped admin tokens.
  - >-
    ``service_account_token`` - add regression tests that pin the token-creation
    payload to ``name``, ``scopes``, ``description``, and ``expires_in_days``,
    so the module never sends fields that Artifact Keeper 1.10.2 rejects.
